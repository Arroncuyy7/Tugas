<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://www.gstatic.com;
                   style-src 'self';
                   connect-src https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com;
                   img-src 'self';
                   font-src 'self';
                   object-src 'none';
                   base-uri 'self';">
    <title>Tugas App</title>
    <link rel="stylesheet" href="Perbagus.css">
</head>
<body>
    <div class="container">
        <h1>Daftar Tugas</h1>
        <button id="addTaskBtn">Tambah Tugas</button>
        <div id="taskForm" class="hidden">
            <input type="text" id="taskInput" placeholder="Masukkan tugas" required maxlength="200">
            <input type="date" id="deadlineInput" required>
            <button id="saveTaskBtn">Simpan Tugas</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <!-- Firebase config (gitignored — copy firebase-config.example.js to firebase-config.js) -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
